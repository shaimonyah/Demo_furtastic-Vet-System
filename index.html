let db, page="dashboard", collapsed=localStorage.getItem("ft-collapsed")==="1", modal=null, query="", filter="All", toastTimer;
function loadDb(){try{const raw=localStorage.getItem("furtastic-vet-demo-v1");if(!raw){db=structuredClone(SEED);saveDb();}else{db=JSON.parse(raw);collectionNames.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});if(!Array.isArray(db.activity))db.activity=[]}}catch(e){db=structuredClone(SEED);saveDb()}}
function saveDb(){localStorage.setItem("furtastic-vet-demo-v1",JSON.stringify(db))}
const byId=(key,id)=>db[key].find(x=>x.id===id);
const clientName=id=>{const c=byId("clients",id);return c?`${c.firstName} ${c.surname}`:"Unknown client"};
const petName=id=>byId("pets",id)?.name||"Unknown pet";
const petOwner=id=>{const p=byId("pets",id);return p?clientName(p.ownerId):"—"};

const statusClass=s=>({"Confirmed":"green","Completed":"lavender","Pending":"gold","Cancelled":"rose","Paid":"green","Partially Paid":"gold","Unpaid":"rose"})[s]||"";
function addActivity(text){db.activity.unshift({text,date:today});db.activity=db.activity.slice(0,16);saveDb()}
function toast(msg,error=false){let region=document.querySelector(".toast-region");if(!region){region=document.createElement("div");region.className="toast-region";document.body.append(region)}const t=document.createElement("div");t.className=`toast${error?" error":""}`;t.setAttribute("role","status");t.textContent=msg;region.append(t);setTimeout(()=>t.remove(),3300)}
function navItems(){return Object.keys(labels).map(k=>`<button class="nav-item ${page===k?"active":""}" data-page="${k}" title="${labels[k]}" aria-current="${page===k?"page":"false"}">${icon(navIcons[k])}<span class="nav-label">${labels[k]}</span></button>`).join("")}

-trigger" type="button" data-action="toggle-profile" aria-controls="profile-menu" aria-expanded="false"><span class="staff-avatar">VS</span><span class="profile-copy"><strong>Veterinary staff</strong><small>Demo account</small></span><span class="profile-caret" aria-hidden="true">⌄</span></button><div class="profile-menu hidden" id="profile-menu"><div class="profile-menu-head"><span class="staff-avatar">VS</span><span><strong>Veterinary staff</strong><small>Veterinarian · Demo</small></span></div><button class="profile-menu-item" data-action="reset">Reset demo data</button><button class="profile-menu-item logout-item" data-action="logout">Sign out</button></div></div></div></header><main class="workspace" id="workspace"></main></div></div><div id="modal-root"></div>`;renderPage()}

function renderPage(){const el=document.querySelector("#workspace");if(!el)return;query="";filter="All";const renders={dashboard:dashboardPage,clients:()=>listPage("clients"),pets:()=>listPage("pets"),appointments:appointmentsPage,visits:()=>listPage("visits"),inventory:()=>listPage("inventory"),bills:()=>listPage("bills"),expenses:()=>listPage("expenses")};el.innerHTML=(renders[page]||dashboardPage)()}

ont-weight:400;color:#938a9c">· ${esc(clientName(a.clientId))}</span></div><div class="visit-meta">${esc(a.service)} · ${esc(a.address)}</div></div><div class="visit-right">${status(a.status)}</div></div>`).join(""):empty("A little breathing room","No home visits are scheduled for today.")}</div></article><article class="card">${cardHead("Quick actions","The work you do most often")}<div class="quick-grid">${[["clients","Add a client","users"],["pets","Register a pet","paw"],["appointments","Book a visit","calendar"],["inventory","Add inventory","box"]].map(([p,l,i])=>`<button class="quick-action" data-action="new-${p}"><span class="quick-icon">${icon(i)}</span>${l}</button>`).join("")}</div></article><article class="card">${cardHead("Upcoming home visits","Your next few days",`<span class="pill lavender">${upcoming.length} planned</span>`)}<div class="visit-list">${upcoming.length?upcoming.map(a=>`<div class="visit-row"><div class="visit-time">${dateFmt(a.date).split(",")[0]}<div class="sub-cell">${esc(a.time)}</div></div><div><div class="visit-name">${esc(petName(a.petId))} · ${esc(clientName(a.clientId))}</div><div class="visit-meta">${esc(a.service)}</div></div><div class="visit-right">${status(a.status)}</div></div>`).join(""):empty("No upcoming visits","New bookings will appear here.")}</div></article><article class="card">${cardHead("Recent activity","A small trail of care")}<div class="activity">${db.activity.slice(0,5).map(a=>`<div class="activity-line"><span class="activity-dot"></span><div>${esc(a.text)}<time>${dateFmt(a.date)}</time></div></div>`).join("")||empty("No activity yet","Updates appear here as you work.")}</div></article></section>`}

function listPage(key){const d=definitions[key];let data=db[key].filter(x=>!query||d.searchable(x).toLowerCase().includes(query.toLowerCase()));if(filter!=="All"){if(key==="appointments")data=data.filter(x=>x.status===filter);if(key==="inventory")data=data.filter(x=>(Number(x.quantity)<=Number(x.minStockLevel)?"Low stock":"In stock")===filter);if(key==="bills")data=data.filter(x=>x.status===filter)}
let extra=key==="appointments"?`<select class="filter-select" data-filter><option>All</option>${["Pending","Confirmed","Completed","Cancelled"].map(s=>`<option ${filter===s?"selected":""}>${s}</option>`).join("")}</select><button class="btn soft" data-action="calendar">Calendar view</button>`:key==="inventory"?`<select class="filter-select" data-filter><option>All</option><option ${filter==="Low stock"?"selected":""}>Low stock</option><option ${filter==="In stock"?"selected":""}>In stock</option></select>`:key==="bills"?`<select class="filter-select" data-filter><option>All</option>${["Paid","Partially Paid","Unpaid"].map(s=>`<option ${filter===s?"selected":""}>${s}</option>`).join("")}</select>`:"";
return `${pageHead(d.title,d.sub,`new-${key}`,d.add)}${key==="bills"?`<div class="stats-grid"><article class="card stat-card"><div class="stat-label">Outstanding balance</div><div class="stat-number" style="font-size:22px">${money(db.bills.reduce((s,b)=>s+Number(b.balance),0))}</div><div class="stat-foot">Across ${db.bills.filter(b=>b.balance>0).length} open invoices</div></article><article class="card stat-card"><div class="stat-label">Collected this month</div><div class="stat-number" style="font-size:22px">${money(db.bills.filter(b=>b.date?.slice(0,7)===today.slice(0,7)).reduce((s,b)=>s+Number(b.amountPaid),0))}</div><div class="stat-foot">Recorded payments</div></article></div>`:""}${key==="expenses"?`<div class="card" style="padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between"><span style="font-size:12px;font-weight:700">Total recorded expenses</span><strong>${money(db.expenses.reduce((s,e)=>s+Number(e.amount),0))}</strong></div>`:""}<section class="card">${cardHead(key==="appointments"?"Visit schedule":d.title,`${data.length} ${data.length===1?"record":"records"}`)}<div class="toolbar" style="padding:0 17px 13px"><div class="search-box">${icon("search")}<input class="search-input" data-search placeholder="${d.search}" aria-label="${d.search}"></div>${extra}</div>${data.length?`<div class="table-wrap"><table class="data-table"><thead><tr>${d.cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th style="text-align:right">Actions</th></tr></thead><tbody>${data.map(x=>`<tr data-row-id="${esc(x.id)}">${d.row(x).map((v,i)=>`<td class="${i===0?"primary-cell":""}">${String(v).startsWith('<span class="pill')?v:esc(v)}</td>`).join("")}<td><div class="row-actions">${key==="appointments"?`<button class="icon-btn" data-action="cycle-status" data-id="${esc(x.id)}" title="Change status">Status</button>`:""}${key==="inventory"?`<button class="icon-btn" data-action="stock" data-id="${esc(x.id)}">+ Stock</button>`:""}${key==="bills"?`<button class="icon-btn" data-action="payment" data-id="${esc(x.id)}">Payment</button><button class="icon-btn" data-action="print" data-id="${esc(x.id)}">Print</button>`:""}<button class="icon-btn" data-action="detail" data-key="${key}" data-id="${esc(x.id)}">View</button><button class="icon-btn" data-action="edit" data-key="${key}" data-id="${esc(x.id)}">Edit</button><button class="icon-btn" data-action="delete" data-key="${key}" data-id="${esc(x.id)}" aria-label="Delete record">Delete</button></div></td></tr>`).join("")}</tbody></table></div>`:empty(query?"No matching records":"No records yet",query?"Try a different search or filter.":"Use the button above to add your first record.")}</section>${key==="appointments"?`<section class="card" style="margin-top:15px">${cardHead("This week","A calendar-style look at home visits")}<div class="schedule-grid">${weekDates().map(d=>`<div class="day-column ${d===today?"today":""}"><div class="day-label">${new Date(`${d}T12:00:00`).toLocaleDateString("en-PH",{weekday:"short"})}</div><div class="day-date">${new Date(`${d}T12:00:00`).getDate()}</div>${db.appointments.filter(a=>a.date===d&&a.status!=="Cancelled").map(a=>`<div class="schedule-event" data-action="edit" data-key="appointments" data-id="${esc(a.id)}"><strong>${esc(a.time)} · ${esc(petName(a.petId))}</strong>${esc(a.service)}</div>`).join("")}</div>`).join("")}</div></section>`:""}`;
}
function weekDates(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().slice(0,10)})}
function appointmentsPage(){return listPage("appointments")}
function fieldMarkup(f,obj={}){const [name,label,type,required=false,opts=[],wide=""]=f;const value=obj[name]??(name==="date"||name==="vaccinationDate"?today:name==="time"?"09:00":name==="status"?(obj.id?"Pending":"Pending"):"");let input="";
 if(type==="client")input=`<select id="f-${name}" name="${name}" ${required?"required":""}><option value="">Choose a client</option>${db.clients.map(c=>`<option value="${esc(c.id)}" ${value===c.id?"selected":""}>${esc(c.firstName)} ${esc(c.surname)} — ${esc(c.contact)}</option>`).join("")}</select>`;
 else if(type==="pet")input=`<select id="f-${name}" name="${name}" ${required?"required":""}><option value="">Choose a pet</option>${db.pets.map(p=>`<option value="${esc(p.id)}" ${value===p.id?"selected":""}>${esc(p.name)} — ${esc(clientName(p.ownerId))} (${esc(p.species)})</option>`).join("")}</select>`;
 else if(type==="select")input=`<select id="f-${name}" name="${name}" ${required?"required":""}><option value="">Choose…</option>${(Array.isArray(opts)?opts:[]).map(o=>`<option ${value===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
 else if(type==="textarea")input=`<textarea id="f-${name}" name="${name}" placeholder="Add useful details…">${esc(value)}</textarea>`;
 else input=`<input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?"required":""} ${type==="number"?'step="any" min="0"':""} placeholder="${label}">`;
 return `<div class="field ${(wide==="span"||opts==="span")?"span-2":""}"><label for="f-${name}">${label}${required?' <span aria-hidden="true">*</span>':""}</label>${input}</div>`
}
function openForm(key,id=null){const d=definitions[key];if(!d)return;if(key==="bills"){openBillForm(id);return}const obj=id?byId(key,id):{};if(key==="pets"&&!obj.id&&!db.clients.length){toast("Add a client before registering a pet.",true);return}if(key==="appointments"&&!obj.id&&!db.clients.length){toast("Add a client and pet before booking a visit.",true);return}if(key==="visits"&&!obj.id&&!db.pets.length){toast("Register a pet before recording a visit.",true);return}modal={type:"form",key,id};document.querySelector("#modal-root").innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${id?"Edit":"Add"} ${d.title.slice(0,-1).toLowerCase()}</h2><p>Changes are saved on this device only.</p></div><button class="modal-close" data-action="close-modal" aria-label="Close dialog">×</button></div><form id="record-form"><div class="modal-content"><div class="form-grid">${d.fields.map(f=>fieldMarkup(f,obj)).join("")}</div></div><div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Cancel</button><button type="submit" class="btn">${id?"Save changes":"Save record"}</button></div></form></section></div>`;document.querySelector("#record-form input, #record-form select, #record-form textarea")?.focus();if(key==="appointments"){const client=document.querySelector('[name="clientId"]'),pet=document.querySelector('[name="petId"]');const refreshPets=(keep=true)=>{const prior=keep?pet.value:"";pet.innerHTML=`<option value="">Choose a pet</option>${db.pets.filter(p=>!client.value||p.ownerId===client.value).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} — ${esc(clientName(p.ownerId))} (${esc(p.species)})</option>`).join("")}`;if(db.pets.some(p=>p.id===prior&&(!client.value||p.ownerId===client.value)))pet.value=prior};client.addEventListener("change",()=>refreshPets(false));pet.addEventListener("change",()=>{const selected=byId("pets",pet.value);if(selected)client.value=selected.ownerId})}}
function openBillForm(id=null){if(!db.clients.length||!db.pets.length){toast("Add a client and pet before creating an invoice.",true);return}const b=id?byId("bills",id):null;modal={type:"bill",id};const petOpts=db.pets.map(p=>`<option value="${esc(p.id)}" ${b?.petId===p.id?"selected":""}>${esc(p.name)} — ${esc(clientName(p.ownerId))}</option>`).join("");const lineRows=(b?.lines?.length?b.lines:[{description:"",kind:"Service",quantity:1,price:0}]).map(l=>`<div class="line-row"><input class="line-desc" name="description" placeholder="Home consultation" value="${esc(l.description)}" required><select name="kind"><option ${l.kind==="Service"?"selected":""}>Service</option><option ${l.kind==="Product"?"selected":""}>Product</option></select><input name="quantity" type="number" min=".01" step=".01" value="${esc(l.quantity)}" required><input name="price" type="number" min="0" step=".01" value="${esc(l.price)}" required><button type="button" class="icon-btn remove-line" data-action="remove-line" aria-label="Remove line">×</button></div>`).join("");document.querySelector("#modal-root").innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${b?"Edit invoice":"Create invoice"}</h2><p>Link an invoice to a patient and medical visit. Amounts are in PHP.</p></div><button class="modal-close" data-action="close-modal" aria-label="Close dialog">×</button></div><form id="bill-form"><div class="modal-content"><div class="form-grid"><div class="field"><label for="bill-pet">Patient</label><select id="bill-pet" name="petId" required>${petOpts}</select></div><div class="field"><label for="bill-visit">Linked medical visit</label><select id="bill-visit" name="visitId"><option value="">No linked visit</option></select></div><div class="field"><label for="bill-date">Invoice date</label><input id="bill-date" name="date" type="date" value="${esc(b?.date||today)}" required></div><div class="field"><label for="bill-paid">${b?"Amount paid to date":"Initial payment"} (PHP)</label><input id="bill-paid" name="amountPaid" type="number" min="0" step=".01" value="${esc(b?.amountPaid||0)}"></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0"><strong style="font:700 12px Manrope">Itemized lines</strong><button type="button" class="btn soft small" data-action="add-line">${icon("plus")} Add line</button></div><div class="line-row line-labels" style="font-size:9px;text-transform:uppercase;color:#938a9c;font-weight:700"><span class="line-desc">Description</span><span>Type</span><span>Qty</span><span>Price / unit</span><span></span></div><div id="bill-lines">${lineRows}</div><div style="text-align:right;margin-top:14px;font-size:12px">Invoice total <strong id="bill-total">${money(0)}</strong><div style="margin-top:5px">Balance due <strong id="bill-balance">${money(0)}</strong></div></div><p class="sub-cell">Payment cannot exceed invoice total. The status updates automatically from amount paid.</p></div><div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Cancel</button><button type="submit" class="btn">${b?"Save invoice changes":"Save invoice"}</button></div></form></section></div>`;updateBillVisitOptions();if(b)document.querySelector("#bill-visit").value=b.visitId||"";document.querySelector("#bill-pet").addEventListener("change",updateBillVisitOptions);document.querySelector("#bill-form").addEventListener("input",calculateBill);calculateBill()}
function updateBillVisitOptions(){const pet=document.querySelector("#bill-pet")?.value,sel=document.querySelector("#bill-visit");if(!sel)return;const visits=db.visits.filter(v=>v.petId===pet);sel.innerHTML=`<option value="">No linked visit</option>${visits.map(v=>`<option value="${v.id}">${dateFmt(v.date)} · ${esc(v.diagnosis)}</option>`).join("")}`}
function calculateBill(){const rows=[...document.querySelectorAll("#bill-lines .line-row")];let total=0;rows.forEach(r=>{total+=(Number(r.querySelector('[name="quantity"]').value)||0)*(Number(r.querySelector('[name="price"]').value)||0)});const paid=Number(document.querySelector("#bill-paid")?.value)||0;document.querySelector("#bill-total").textContent=money(total);document.querySelector("#bill-balance").textContent=money(Math.max(0,total-paid));return {total,paid}}
function openDetail(key,id){const obj=byId(key,id);if(!obj)return;modal={type:"detail",key,id};let content="";
 if(key==="clients"){const pets=db.pets.filter(p=>p.ownerId===id);content=`<div class="profile-banner"><div class="profile-avatar">${esc(obj.firstName[0]+obj.surname[0])}</div><div><h2>${esc(obj.firstName)} ${esc(obj.surname)}</h2><p>${esc(obj.contact)} · ${esc(obj.email||"No email")}</p></div></div><div class="detail-grid"><div class="card detail-card"><h3>Household details</h3><div class="detail-item"><strong>Address:</strong> ${esc(obj.address)}</div><div class="detail-item"><strong>Notes:</strong> ${esc(obj.notes||"—")}</div></div><div class="card detail-card"><h3>Pets in this family</h3>${pets.map(p=>`<div class="detail-item"><strong>${esc(p.name)}</strong> · ${esc(p.species)}, ${esc(p.breed)} <button class="icon-btn" data-action="detail" data-key="pets" data-id="${p.id}">Profile</button></div>`).join("")||"No pets registered yet."}<button class="btn soft small" data-action="new-pets" style="margin-top:10px">Register a pet</button></div><div class="card detail-card" style="grid-column:1/-1"><h3>Home visit history</h3>${db.appointments.filter(a=>a.clientId===id).map(a=>`<div class="detail-item">${dateFmt(a.date)} · ${esc(petName(a.petId))} — ${esc(a.service)} ${status(a.status)}</div>`).join("")||"No visits yet."}</div></div>`}
 else if(key==="pets"){const visits=db.visits.filter(v=>v.petId===id).sort((a,b)=>b.date.localeCompare(a.date));content=`<div class="profile-banner"><div class="profile-avatar">${icon("paw")}</div><div><h2>${esc(obj.name)}</h2><p>${esc(obj.species)} · ${esc(obj.breed)} · ${esc(obj.sex)} · ${esc(petOwner(id))}</p></div><button class="btn soft small" data-action="new-visits" style="margin-left:auto">Record visit</button></div><div class="detail-grid"><div class="card detail-card"><h3>Patient details</h3><div class="detail-item"><strong>Date of birth:</strong> ${dateFmt(obj.birthDate)}</div><div class="detail-item"><strong>Current weight:</strong> ${esc(obj.weight||"—")} kg</div><div class="detail-item"><strong>Owner:</strong> ${esc(petOwner(id))}</div></div><div class="card detail-card"><h3>Vaccination history</h3>${visits.filter(v=>v.vaccineName).map(v=>`<div class="detail-item"><strong>${esc(v.vaccineName)}</strong><br>${dateFmt(v.vaccinationDate)} · ${esc(v.manufacturer)} · Lot ${esc(v.lotNumber)}</div>`).join("")||"No vaccines recorded."}</div><div class="card detail-card" style="grid-column:1/-1"><h3>Medical history</h3>${visits.map(v=>`<div class="detail-item"><strong>${dateFmt(v.date)} · ${esc(v.diagnosis)}</strong><br>${esc(v.treatment)}${v.followUpDate?` · Follow up ${dateFmt(v.followUpDate)}`:""}<br>${esc(v.notes||"")}</div>`).join("")||"No medical visits recorded."}</div></div>`}
 else if(key==="inventory")content=`<div class="detail-grid"><div class="card detail-card"><h3>${esc(obj.name)}</h3><div class="detail-item"><strong>Category:</strong> ${esc(obj.category)}</div><div class="detail-item"><strong>Current stock:</strong> ${esc(obj.quantity)} ${esc(obj.unit)}</div><div class="detail-item"><strong>Reorder below:</strong> ${esc(obj.minStockLevel)} ${esc(obj.unit)}</div><div class="detail-item"><strong>Unit cost:</strong> ${money(obj.unitCost)}</div>${Number(obj.quantity)<=Number(obj.minStockLevel)?'<span class="pill rose">Low stock</span>':'<span class="pill green">In stock</span>'}</div><div class="card detail-card"><h3>Stock action</h3><p class="sub-cell">Record stock received. The quantity updates immediately.</p><button class="btn" data-action="stock" data-id="${obj.id}">Add stock</button></div></div>`;
 else if(key==="bills")content=invoiceMarkup(obj);
 else if(key==="appointments")content=`<div class="detail-grid"><div class="card detail-card"><h3>${esc(petName(obj.petId))} · ${esc(clientName(obj.clientId))}</h3><div class="detail-item"><strong>Service:</strong> ${esc(obj.service)}</div><div class="detail-item"><strong>Date & time:</strong> ${dateFmt(obj.date)} · ${esc(obj.time)}</div><div class="detail-item"><strong>Home address:</strong> ${esc(obj.address)}</div><div class="detail-item"><strong>Status:</strong> ${status(obj.status)}</div></div><div class="card detail-card"><h3>Visit actions</h3><button class="btn soft small" data-action="cycle-status" data-id="${obj.id}">Change status</button> <button class="btn soft small" data-action="edit" data-key="appointments" data-id="${obj.id}">Reschedule / edit</button><p class="sub-cell">Status can move from Pending to Confirmed to Completed, or be cancelled.</p></div></div>`;
 else if(key==="visits")content=`<div class="card detail-card"><h3>${esc(petName(obj.petId))} · ${esc(petOwner(obj.petId))}</h3><div class="detail-item"><strong>Visit date:</strong> ${dateFmt(obj.date)}</div><div class="detail-item"><strong>Diagnosis:</strong> ${esc(obj.diagnosis)}</div><div class="detail-item"><strong>Treatment:</strong> ${esc(obj.treatment)}</div><div class="detail-item"><strong>Clinical notes:</strong> ${esc(obj.notes||"—")}</div><div class="detail-item"><strong>Follow-up:</strong> ${dateFmt(obj.followUpDate)}</div><div class="detail-item"><strong>Vaccine:</strong> ${esc(obj.vaccineName||"—")} ${obj.vaccineName?`· ${esc(obj.manufacturer)} · lot ${esc(obj.lotNumber)}`:""}</div></div>`;
 else content=`<div class="card detail-card"><h3>${esc(obj.description)}</h3><div class="detail-item">${dateFmt(obj.date)} · ${esc(obj.category)}</div><div class="detail-item"><strong>Amount:</strong> ${money(obj.amount)}</div></div>`;
 document.querySelector("#modal-root").innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal ${key==="bills"||key==="clients"||key==="pets"?"wide":""}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${labels[key]} details</h2><p>Demo records are stored in this browser.</p></div><button class="modal-close" data-action="close-modal" aria-label="Close dialog">×</button></div><div class="modal-content">${content}</div><div class="modal-actions"><button class="btn secondary" data-action="close-modal">Close</button>${key!=="bills"&&key!=="inventory"?`<button class="btn" data-action="edit" data-key="${key}" data-id="${id}">Edit record</button>`:""}</div></section></div>`
}
function invoiceMarkup(b){return `<div class="receipt"><h3>Fur-tastic Veterinary Home Service</h3><p>Invoice #${esc(b.id.slice(-4).toUpperCase())} · ${dateFmt(b.date)}</p><p>Billed to ${esc(clientName(b.clientId))} · Patient ${esc(petName(b.petId))}</p><div style="margin:16px 0;border-top:1px solid #e9e2ee">${(b.lines||[]).map(l=>`<div class="detail-item" style="display:flex;justify-content:space-between"><span>${esc(l.description)} <span class="sub-cell">${esc(l.kind)} · ${esc(l.quantity)} × ${money(l.price)}</span></span><strong>${money(l.quantity*l.price)}</strong></div>`).join("")}</div><div class="detail-item"><strong>Total:</strong> ${money(b.total)}</div><div class="detail-item"><strong>Paid:</strong> ${money(b.amountPaid)}</div><div class="detail-item"><strong>Balance:</strong> ${money(b.balance)} · ${status(b.status)}</div>${b.visitId?`<div class="detail-item"><strong>Linked visit:</strong> ${dateFmt(byId("visits",b.visitId)?.date)} · ${esc(byId("visits",b.visitId)?.diagnosis||"")}</div>`:""}</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn soft small" data-action="payment" data-id="${b.id}">Record payment</button><button class="btn small" data-action="print" data-id="${b.id}">Print receipt</button></div>`}
function openPayment(id){const b=byId("bills",id);if(!b)return;if(Number(b.balance)<=0){toast("This invoice is already paid.");return}modal={type:"payment",id};document.querySelector("#modal-root").innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">Record a payment</h2><p>Invoice balance: ${money(b.balance)}</p></div><button class="modal-close" data-action="close-modal" aria-label="Close dialog">×</button></div><form id="payment-form"><div class="modal-content"><div class="field"><label for="payment-amount">Payment received (PHP)</label><input id="payment-amount" name="amount" type="number" min=".01" max="${b.balance}" step=".01" required autofocus></div><p class="sub-cell">Amount must be greater than zero and no more than the remaining balance.</p></div><div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" type="submit">Apply payment</button></div></form></section></div>`}
function openStock(id){const item=byId("inventory",id);if(!item)return;modal={type:"stock",id};document.querySelector("#modal-root").innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">Add stock</h2><p>${esc(item.name)} · current ${item.quantity} ${esc(item.unit)}</p></div><button class="modal-close" data-action="close-modal" aria-label="Close dialog">×</button></div><form id="stock-form"><div class="modal-content"><div class="field"><label for="stock-qty">Quantity received (${esc(item.unit)})</label><input id="stock-qty" name="quantity" type="number" min=".01" step=".01" required autofocus></div></div><div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Cancel</button><button class="btn">Update stock</button></div></form></section></div>`}
function closeModal(){modal=null;document.querySelector("#modal-root").innerHTML=""}
function loginScreen(){document.querySelector("#app").innerHTML=`<main class="login-screen"><section class="login-story"><div class="brand-lockup"><div class="brand-mark">${logo}</div><div><div class="brand-name">Fur-tastic Veterinary</div><div class="brand-sub">Veterinary Records Management System · Home Service</div></div></div><div class="eyebrow" style="margin-top:48px">Care that comes home</div><h1>Good care starts at <em>their front door.</em></h1><p>A quiet, organized workspace for the people who bring veterinary care to every doorstep. Keep each patient’s story close, wherever the visit takes you.</p><div class="story-note"><span>${icon("home")}</span><span>For a kinder kind of house call.</span></div></section><section class="login-card"><h2>Welcome back</h2><p>Sign in to your demo care workspace.</p><form id="login-form" novalidate><div class="field"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" value="team@furtastic.demo" autocomplete="username" required placeholder="you@example.com"></div><div class="field"><label for="login-password">Password</label><div class="input-wrap"><input id="login-password" name="password" type="password" value="careathome" autocomplete="current-password" required minlength="4"><button class="text-toggle" type="button" data-action="toggle-password">Show</button></div></div><div class="login-error" id="login-error" aria-live="polite"></div><button class="btn full" type="submit">Enter demo workspace ${icon("chevron")}</button></form><div class="demo-callout"><strong>Demo only — not real authentication.</strong> This prototype stores sample records in your browser’s localStorage. Do not enter real client or patient information.</div></section></main>`}
function signedIn(){return localStorage.getItem("furtastic-demo-session")==="yes"}
function start(){loadDb();localStorage.removeItem("furtastic-demo-session");loginScreen()}
document.addEventListener("click",e=>{
 if(e.target.id==="mobile-drawer-backdrop")closeMobileDrawer();
 if(!e.target.closest(".profile-wrap"))closeProfileMenu();
 const target=e.target.closest("[data-action],[data-page]");if(!target)return;
 if(target.dataset.page){page=target.dataset.page;document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.page===page));document.querySelector(".top-title").innerHTML=`Fur-tastic <span style="color:#a89eb1">/</span> ${labels[page]}`;closeMobileDrawer();closeProfileMenu();renderPage();return}
 const act=target.dataset.action,id=target.dataset.id,key=target.dataset.key;
 if(act==="toggle-password"){const p=document.querySelector("#login-password");p.type=p.type==="password"?"text":"password";target.textContent=p.type==="password"?"Show":"Hide"}
 if(act==="collapse"){collapsed=!collapsed;localStorage.setItem("ft-collapsed",collapsed?"1":"0");document.querySelector(".sidebar").classList.toggle("collapsed",collapsed)}
 if(act==="mobile-nav"){document.querySelector("#mobile-drawer-backdrop")?.classList.remove("hidden");document.body.classList.add("drawer-open");target.setAttribute("aria-expanded","true")}
 if(act==="close-mobile")closeMobileDrawer();
 if(act==="toggle-profile"){const menu=document.querySelector("#profile-menu"),opening=menu.classList.toggle("hidden");target.setAttribute("aria-expanded",String(!opening))}
 if(act==="logout"){localStorage.removeItem("furtastic-demo-session");page="dashboard";loginScreen()}
 if(act==="reset"){if(confirm("Reset all demo records to the original sample data? This will remove local changes from this browser.")){localStorage.removeItem("furtastic-vet-demo-v1");loadDb();page="dashboard";shell();toast("Demo data restored to its original sample.")}}
 if(act==="new-clients")openForm("clients");if(act==="new-pets")openForm("pets");if(act==="new-appointments")openForm("appointments");if(act==="new-visits")openForm("visits");if(act==="new-inventory")openForm("inventory");if(act==="new-bills")openForm("bills");if(act==="new-expenses")openForm("expenses");
 if(act==="calendar"){document.querySelector(".schedule-grid")?.scrollIntoView({behavior:"smooth",block:"center"})}
 if(act==="close-modal")closeModal();
 if(act==="backdrop-close"&&e.target===target)closeModal();
 if(act==="edit")openForm(key,id);
 if(act==="detail")openDetail(key,id);
 if(act==="delete"){const obj=byId(key,id);if(!obj)return;const label=key==="clients"?`${obj.firstName} ${obj.surname}`:key==="pets"?obj.name:key==="bills"?`invoice #${id.slice(-4)}`:obj.name||obj.description||obj.diagnosis||"this record";if(confirm(`Delete ${label}? This cannot be undone.`)){if(key==="clients"&&db.pets.some(p=>p.ownerId===id)){toast("This client has registered pets. Reassign or remove them first.",true);return}if(key==="pets"&&(db.appointments.some(a=>a.petId===id)||db.visits.some(v=>v.petId===id))){toast("This pet has visit records. Keep the patient profile to preserve history.",true);return}db[key]=db[key].filter(x=>x.id!==id);addActivity(`Removed ${label}`);closeModal();renderPage();toast("Record deleted.")}}
 if(act==="cycle-status"){const a=byId("appointments",id);if(a){a.status=({Pending:"Confirmed",Confirmed:"Completed",Completed:"Cancelled",Cancelled:"Pending"})[a.status];saveDb();addActivity(`${petName(a.petId)}’s visit marked ${a.status}`);if(modal?.type==="detail")openDetail("appointments",id);else renderPage();toast(`Visit marked ${a.status.toLowerCase()}.`)}}
 if(act==="stock")openStock(id);
 if(act==="payment")openPayment(id);
 if(act==="print"){const b=byId("bills",id);if(b){const win=window.open("","_blank");if(!win){toast("Allow pop-ups to print this receipt.",true);return}win.document.write(`<html><head><title>Invoice ${esc(b.id)}</title><style>body{font:14px sans-serif;color:#382c55;padding:32px;max-width:700px;margin:auto}h1{font-size:22px}table{width:100%;border-collapse:collapse;margin:24px 0}td{padding:10px;border-bottom:1px solid #ddd}td:last-child{text-align:right}.total{font-weight:bold}</style></head><body><h1>Fur-tastic Veterinary Home Service</h1><p>Invoice #${esc(b.id.slice(-4).toUpperCase())} · ${dateFmt(b.date)}</p><p>Client: ${esc(clientName(b.clientId))} · Patient: ${esc(petName(b.petId))}</p><table>${b.lines.map(l=>`<tr><td>${esc(l.description)} · ${esc(l.quantity)} × ${money(l.price)}</td><td>${money(l.quantity*l.price)}</td></tr>`).join("")}<tr class="total"><td>Total</td><td>${money(b.total)}</td></tr><tr><td>Paid</td><td>${money(b.amountPaid)}</td></tr><tr><td>Balance due</td><td>${money(b.balance)}</td></tr></table><p>${esc(b.status)} · Thank you for trusting us with your pet’s care.</p><script>window.print()<\/script></body></html>`);win.document.close()}}
 if(act==="add-line"){const box=document.querySelector("#bill-lines");if(box){const row=document.createElement("div");row.className="line-row";row.innerHTML=`<input class="line-desc" name="description" placeholder="Item or service" required><select name="kind"><option>Service</option><option>Product</option></select><input name="quantity" type="number" min=".01" step=".01" value="1" required><input name="price" type="number" min="0" step=".01" value="0" required><button type="button" class="icon-btn remove-line" data-action="remove-line" aria-label="Remove line">×</button>`;box.append(row);calculateBill()}}
 if(act==="remove-line"){const rows=document.querySelectorAll("#bill-lines .line-row");if(rows.length>1){target.closest(".line-row").remove();calculateBill()}else toast("An invoice needs at least one line.",true)}
});
function applyRowFilters(){const q=(document.querySelector("[data-search]")?.value||"").toLowerCase();let shown=0;document.querySelectorAll(".data-table tbody tr").forEach(tr=>{const row=byId(page,tr.dataset.rowId);let matches=!q||definitions[page]?.searchable(row||{}).toLowerCase().includes(q);if(matches&&filter!=="All"&&row){if(page==="appointments")matches=row.status===filter;if(page==="inventory")matches=(Number(row.quantity)<=Number(row.minStockLevel)?"Low stock":"In stock")===filter;if(page==="bills")matches=row.status===filter}tr.hidden=!matches;if(matches)shown++});let note=document.querySelector("#filtered-empty");if(shown===0&&document.querySelector(".data-table")){if(!note){note=document.createElement("div");note.id="filtered-empty";note.className="empty-state";note.innerHTML=`<div class="empty-symbol">${icon("search")}</div><strong>No matching records</strong><p>Try a different search or filter.</p>`;document.querySelector(".table-wrap")?.after(note)}note.hidden=false}else if(note)note.hidden=true}
document.addEventListener("input",e=>{if(e.target.matches("[data-search]"))applyRowFilters()});
document.addEventListener("change",e=>{if(e.target.matches("[data-filter]")){filter=e.target.value;applyRowFilters()}});
document.addEventListener("submit",e=>{
 if(e.target.id==="login-form"){e.preventDefault();const fd=new FormData(e.target),email=String(fd.get("email")||"").trim(),password=String(fd.get("password")||"");const err=document.querySelector("#login-error");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent="Enter a valid email address.";document.querySelector("#login-email").focus();return}if(password.length<4){err.textContent="Enter a password of at least 4 characters.";document.querySelector("#login-password").focus();return}localStorage.setItem("furtastic-demo-session","yes");shell();toast("Welcome to the demo care workspace.");return}
 if(e.target.id==="record-form"){e.preventDefault();const key=modal.key,id=modal.id,fd=new FormData(e.target),obj=Object.fromEntries(fd.entries());for(const f of definitions[key].fields){if(f[2]==="number"&&obj[f[0]]!=="")obj[f[0]]=Number(obj[f[0]])}if(key==="appointments"&&obj.petId&&byId("pets",obj.petId)?.ownerId!==obj.clientId){toast("Please choose a pet belonging to the selected client.",true);return}if(key==="appointments"&&!obj.address)obj.address=byId("clients",obj.clientId)?.address||"";if(key==="pets"&&obj.weight)obj.weight=Number(obj.weight);if(id){Object.assign(byId(key,id),obj);addActivity(`Updated ${definitions[key].title.toLowerCase()} record`)}else{obj.id=`${key[0]}${Date.now().toString(36)}`;db[key].unshift(obj);addActivity(`Added ${obj.name||obj.firstName+" "+obj.surname||obj.diagnosis||definitions[key].title.toLowerCase()}`)}saveDb();closeModal();renderPage();toast(id?"Changes saved.":"Record added.");return}
 if(e.target.id==="bill-form"){e.preventDefault();const fd=new FormData(e.target),rows=[...document.querySelectorAll("#bill-lines .line-row")],lines=rows.map(r=>({description:r.querySelector('[name="description"]').value.trim(),kind:r.querySelector('[name="kind"]').value,quantity:Number(r.querySelector('[name="quantity"]').value),price:Number(r.querySelector('[name="price"]').value)}));const pet=byId("pets",fd.get("petId")),total=lines.reduce((s,l)=>s+l.quantity*l.price,0),paid=Number(fd.get("amountPaid"))||0;if(!lines.length||lines.some(l=>!l.description||l.quantity<=0||l.price<0)||total<=0){toast("Enter at least one valid invoice line with a total above PHP 0.",true);return}if(paid<0||paid>total){toast("Amount paid cannot exceed the invoice total.",true);return}const id=modal.id;const b={...(id?byId("bills",id):{}),id:id||`b${Date.now().toString(36)}`,clientId:pet.ownerId,petId:pet.id,visitId:fd.get("visitId"),date:fd.get("date"),lines,total,amountPaid:paid,balance:total-paid,status:paid===0?"Unpaid":paid>=total?"Paid":"Partially Paid"};if(id){Object.assign(byId("bills",id),b);addActivity(`Invoice updated for ${clientName(b.clientId)}`)}else{db.bills.unshift(b);addActivity(`Invoice created for ${clientName(b.clientId)} · ${petName(b.petId)}`)}saveDb();closeModal();renderPage();toast(id?"Invoice changes saved.":"Invoice created and linked to the selected patient.");return}
 if(e.target.id==="payment-form"){e.preventDefault();const b=byId("bills",modal.id),amount=Number(new FormData(e.target).get("amount"));if(!b||!Number.isFinite(amount)||amount<=0||amount>b.balance){toast("Enter a valid payment no greater than the outstanding balance.",true);return}b.amountPaid=Number(b.amountPaid)+amount;b.balance=Math.max(0,Number(b.total)-b.amountPaid);b.status=b.balance===0?"Paid":"Partially Paid";addActivity(`Payment of ${money(amount)} recorded for ${clientName(b.clientId)}`);saveDb();closeModal();renderPage();toast(`Payment recorded. Invoice is ${b.status.toLowerCase()}.`);return}
 if(e.target.id==="stock-form"){e.preventDefault();const item=byId("inventory",modal.id),amount=Number(new FormData(e.target).get("quantity"));if(!item||amount<=0){toast("Enter a stock quantity greater than zero.",true);return}item.quantity=Number(item.quantity)+amount;addActivity(`Restocked ${item.name} by ${amount} ${item.unit}`);saveDb();closeModal();renderPage();toast(`${item.name} stock updated.`)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(modal)closeModal();closeMobileDrawer();closeProfileMenu()}});
start();

</script>
</body>
</html>
